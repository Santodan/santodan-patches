name: Release Morphe patch bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Morphe Desktop
        shell: pwsh
        run: |
          $url = 'https://github.com/MorpheApp/morphe-desktop/releases/download/v1.15.1-dev.4/morphe-desktop-1.15.1-dev.4-all.jar'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/morphe-desktop.jar"

      - name: Download Android DEX compiler
        shell: pwsh
        run: |
          $url = 'https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.6.17/r8-8.6.17.jar'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/r8.jar"

      - name: Build patch bundle
        shell: pwsh
        run: |
          ./build.ps1 -MorpheJar "$env:RUNNER_TEMP/morphe-desktop.jar" -JdkHome "$env:JAVA_HOME" -R8Jar "$env:RUNNER_TEMP/r8.jar"

      - name: Validate source descriptor
        shell: pwsh
        run: |
          $metadata = Get-Content bundle.properties -Raw | ConvertFrom-StringData
          $descriptor = Get-Content patches-bundle.json -Raw | ConvertFrom-Json
          if ($descriptor.version -ne $metadata.version) {
            throw "patches-bundle.json version does not match bundle.properties"
          }
          $expected = "santodan-patches-$($metadata.version).mpp"
          if (-not (Test-Path -LiteralPath "dist/$expected")) {
            throw "Missing built bundle: $expected"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: v0.1.0
          body: SantoDan patches for Morphe 0.1.0
          files: dist/santodan-patches-0.1.0.mpp
          fail_on_unmatched_files: true
